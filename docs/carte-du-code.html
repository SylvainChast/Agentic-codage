<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"

    <title>Agentic Codage · Carte du projet</title>
    <style>
      :root {
  color-scheme: light;
  --bg: #f4f5f2;
  --paper: #fff;
  --ink: #182b28;
  --muted: #5d6d68;
  --line: #dce3de;
  --accent: #126448;
  --soft: #e9f3ed;
  --warn: #946318;
  --bad: #a32f35;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font:
    15px/1.55 system-ui,
    -apple-system,
    sans-serif;
  background: var(--bg);
  color: var(--ink);
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
}
a {
  color: var(--accent);
}
.layout {
  display: grid;
  grid-template-columns: 238px 1fr;
  min-height: 100vh;
}
aside {
  padding: 32px 20px;
  background: var(--ink);
  color: #eef7ef;
  position: sticky;
  top: 0;
  height: 100vh;
}
.logo {
  font-size: 18px;
  letter-spacing: -0.5px;
  font-weight: 750;
}
.logo span {
  color: #94d1ab;
}
.tag {
  font:
    10px ui-monospace,
    monospace;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #aec8bb;
  margin: 8px 0 42px;
}
nav {
  display: grid;
  gap: 7px;
}
nav button {
  background: transparent;
  color: #b9cdc4;
  border: 0;
  text-align: left;
  padding: 12px 14px;
  border-radius: 7px;
}
nav button[aria-current="true"] {
  background: #30483f;
  color: #fff;
}
nav button:hover {
  background: #30483f;
}
.aside-foot {
  margin-top: 44px;
  color: #b9cdc4;
  font-size: 12px;
}
.aside-foot b {
  display: block;
  color: #e2efe7;
  margin-bottom: 7px;
}
main {
  padding: 38px 5vw 60px;
  max-width: 1440px;
  width: 100%;
}
.eyebrow {
  font:
    11px ui-monospace,
    monospace;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--accent);
}
header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 25px;
}
h1 {
  font-size: 32px;
  letter-spacing: -1px;
  margin: 8px 0 0;
}
h2 {
  font-size: 20px;
  letter-spacing: -0.5px;
  margin: 0 0 8px;
}
h3 {
  margin: 0;
  font-size: 16px;
}
.sub {
  color: var(--muted);
  margin: 8px 0 0;
}
.pill {
  display: inline-block;
  border-radius: 30px;
  padding: 4px 10px;
  font-size: 11px;
  background: var(--soft);
  color: var(--accent);
  white-space: nowrap;
}
.pill.warn {
  color: var(--warn);
  background: #fff1d6;
}
.pill.bad {
  color: var(--bad);
  background: #fceaea;
}
.toolbar {
  margin: 24px 0;
  display: flex;
  gap: 12px;
  align-items: center;
}
.toolbar input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 12px 16px;
  border-radius: 8px;
  color: var(--ink);
}
.count {
  white-space: nowrap;
  color: var(--muted);
  font-size: 12px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 26px 0;
}
.metric,
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px;
}
.metric .value {
  font-size: 30px;
  font-weight: 650;
  letter-spacing: -1px;
  margin: 10px 0 2px;
}
.metric .label {
  font-size: 12px;
  color: var(--muted);
}
.metric .hint {
  font-size: 11px;
  color: var(--muted);
}
.grid {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 20px;
}
.card + .card {
  margin-top: 14px;
}
.grid > .card + .card {
  margin-top: 0;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child {
  border: 0;
}
.row small {
  display: block;
  color: var(--muted);
}
.section-note {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}
.empty {
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 10px;
  background: var(--paper);
}
.task-title {
  font-weight: 650;
}
code {
  font:
    12px ui-monospace,
    monospace;
  overflow-wrap: anywhere;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font:
    12px/1.6 ui-monospace,
    monospace;
  background: var(--bg);
  padding: 16px;
  border-radius: 6px;
  max-height: 500px;
  overflow: auto;
}
details {
  margin-top: 12px;
}
summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--accent);
}
.table-wrap {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
  text-align: left;
}
th {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
td,
th {
  padding: 13px 14px;
  border-bottom: 1px solid var(--line);
}
td.number {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
footer {
  margin-top: 36px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}
.notice {
  border-left: 3px solid var(--accent);
  padding: 10px 15px;
  background: var(--soft);
  font-size: 13px;
  margin: 20px 0;
}
.error {
  border-color: var(--bad);
  background: #fceaea;
}
.bar {
  height: 7px;
  background: var(--line);
  border-radius: 6px;
  overflow: hidden;
  margin-top: 12px;
}
.bar i {
  height: 100%;
  display: block;
  background: var(--accent);
}
:focus-visible {
  outline: 3px solid #d49831;
  outline-offset: 3px;
}
@media (max-width: 1000px) {
  .metrics {
    grid-template-columns: repeat(2, 1fr);
  }
  .grid {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 700px) {
  .layout {
    display: block;
  }
  aside {
    position: static;
    height: auto;
    padding: 20px;
  }
  .tag,
  .aside-foot {
    display: none;
  }
  nav {
    display: flex;
    overflow: auto;
    gap: 3px;
    margin-top: 16px;
  }
  nav button {
    white-space: nowrap;
    padding: 9px;
  }
  main {
    padding: 25px 18px;
  }
  header {
    align-items: start;
  }
  h1 {
    font-size: 26px;
  }
  .metrics {
    gap: 10px;
  }
  .metric {
    padding: 16px;
  }
  .metric .value {
    font-size: 25px;
  }
}

    </style>

        <footer id="footer"></footer>
      </main>
    </div>

    <script>
      "use strict";
const payload = JSON.parse(document.getElementById("map-data").textContent),
  data = payload.content,
  records = data.records,
  costs = data.costs;
const $ = (id) => document.getElementById(id),
  el = (tag, text, cls) => {
    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  };
const labels = {
  planned: "Planifiée",
  in_progress: "En cours",
  incomplete: "Incomplet",
  estimated: "Estimé",
  recorded: "Renseigné",
  active: "En cours",
  submitted: "En revue",
  accepted: "Acceptée",
  cancelled: "Annulée",
  proposed: "Proposée",
  superseded: "Remplacée",
  open: "Ouvert",
  resolved: "Résolu",
  approve: "Approuvée",
  request_changes: "À reprendre",
};
const money = (n) =>
  n === null
    ? "Non calculable"
    : new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: costs.currency,
      }).format(n / 100);
const filtered = (items) =>
  items.filter((x) =>
    JSON.stringify(x)
      .toLocaleLowerCase()
      .includes($("search").value.toLocaleLowerCase()),
  );
const badge = (text, type = "") => el("span", text, "pill " + type);
function details(record) {
  const d = el("details"),
    s = el("summary", "Voir la fiche source et ses références");
  d.append(s, el("pre", JSON.stringify(record, null, 2)));
  return d;
}
function notice(text, bad = false) {
  return el("div", text, "notice" + (bad ? " error" : ""));
}
function empty(text) {
  return el("div", text, "empty");
}
function metric(label, value, hint) {
  const n = el("div", undefined, "metric");
  n.append(
    el("div", label, "label"),
    el("div", value, "value"),
    el("div", hint, "hint"),
  );
  return n;
}
function section(title, note) {
  const f = document.createDocumentFragment();
  f.append(el("h2", title), el("p", note, "section-note"));
  return f;
}
function cardList(items, titleFor, statusFor) {
  const frag = document.createDocumentFragment(),
    shown = filtered(items);
  $("count").textContent = shown.length + " fiche(s)";
  if (!shown.length)
    frag.append(
      empty(
        "Aucune fiche dans cette vue. Les agents alimentent les sources ; la carte est régénérée.",
      ),
    );
  for (const r of shown) {
    const c = el("article", undefined, "card"),
      row = el("div", undefined, "row");
    row.append(el("h3", titleFor(r)), badge(statusFor(r)));
    c.append(row, el("code", r.id), details(r));
    frag.append(c);
  }
  return frag;
}
function overview() {
  const f = document.createDocumentFragment(),
    metrics = el("div", undefined, "metrics");
  metrics.append(
    metric(
      "Missions exécutées",
      costs.executed_tasks,
      costs.run_count + " exécutions enregistrées",
    ),
    metric(
      "Livrables acceptés",
      costs.accepted_deliverables,
      costs.accepted_tasks + " missions acceptées",
    ),
    metric(
      "Coût connu",
      money(costs.total_known_cost_minor),
      costs.missing_cost_runs + " montant(s) inconnu(s)",
    ),
    metric(
      "Coût / livrable accepté",
      money(costs.cost_per_accepted_deliverable_minor),
      costs.estimated_cost_runs
        ? "Inclut des estimations"
        : "Échecs et reprises inclus",
    ),
  );
  f.append(metrics);
  const grid = el("div", undefined, "grid"),
    left = el("div", undefined, "card"),
    right = el("div", undefined, "card");
  left.append(el("h2", "Travail en cours"));
  const tasks = filtered(records.tasks).filter((t) =>
    ["active", "submitted", "planned"].includes(t.status),
  );
  if (!tasks.length)
    left.append(el("p", "Aucune mission en attente ou en cours.", "sub"));
  for (const t of tasks) {
    const row = el("div", undefined, "row"),
      label = el("div", t.title, "task-title");
    label.append(el("small", t.owner + " · " + t.id));
    row.append(label, badge(labels[t.status]));
    left.append(row);
  }
  right.append(el("h2", "État des contrôles"));
  right.append(
    notice(
      data.validation.ok
        ? "Structure des fiches vérifiée. Les tests produit restent des preuves distinctes."
        : "Des incohérences de fiches demandent une correction.",
      !data.validation.ok,
    ),
  );
  for (const text of [...data.validation.errors, ...data.validation.warnings])
    right.append(el("p", text, "section-note"));
  right.append(
    el(
      "p",
      records.evidence.length +
        " vérification(s) exécutée(s) · " +
        records.reviews.length +
        " revue(s) déclarée(s)",
      "sub",
    ),
  );
  grid.append(left, right);
  f.append(
    grid,
    notice(
      "Réservations actives : consulter « framework lease list ». Elles sont locales au clone et ne sont pas incluses dans cet instantané.",
    ),
  );
  $("count").textContent = records.tasks.length + " missions";
  return f;
}
function economics() {
  const f = section(
    "Économie des livraisons",
    "Montants dans la devise du projet. Chaque tentative, échec, revue et coordination est comptabilisé.",
  );
  if (!costs.complete)
    f.append(
      notice(
        "Coûts incomplets : les ratios concernés restent non calculables. Un montant inconnu ne vaut pas zéro.",
      ),
    );
  if (costs.estimated_cost_runs)
    f.append(
      notice(
        "Certains coûts sont estimés. Ces ratios ne sont pas des coûts entièrement facturés.",
      ),
    );
  const metrics = el("div", undefined, "metrics");
  metrics.append(
    metric(
      "Coût connu total",
      money(costs.total_known_cost_minor),
      "Portefeuille complet",
    ),
    metric(
      "Par mission exécutée",
      money(costs.cost_per_executed_task_minor),
      "Toutes les tentatives incluses",
    ),
    metric(
      "Par mission acceptée",
      money(costs.cost_per_accepted_task_minor),
      "Échecs des autres missions inclus",
    ),
    metric(
      "Par livrable accepté",
      money(costs.cost_per_accepted_deliverable_minor),
      "Nombre de livrables du contrat",
    ),
  );
  f.append(metrics);
  const wrap = el("div", undefined, "table-wrap card"),
    table = el("table"),
    head = el("tr");
  for (const h of [
    "Mission",
    "Exécutions",
    "Coût connu",
    "Budget",
    "Coût de livraison accepté",
    "Livrables acceptés",
    "Mesure",
  ])
    head.append(el("th", h));
  const thead = el("thead");
  thead.append(head);
  table.append(thead);
  const tbody = el("tbody"),
    rows = filtered(costs.tasks);
  for (const r of rows) {
    const row = el("tr");
    for (const v of [
      r.title,
      r.runs,
      money(r.known_cost_minor),
      money(r.budget_minor),
      money(r.delivery.total_cost_minor),
      r.accepted_deliverables,
      labels[r.delivery.state] + " · " + (r.complete
        ? r.estimated_cost_runs
          ? "Estimée"
          : "Renseignée"
        : "Incomplète"),
    ])
      row.append(el("td", v));
    if (r.over_budget) row.lastChild.append(badge("Budget dépassé", "warn"));
    tbody.append(row);
  }
  table.append(tbody);
  wrap.append(table);
  f.append(wrap);
  for (const group of costs.by_role || []) {
    f.append(el("p", group.name + " : " + money(group.known_cost_minor) +
      " connus · " + group.runs + " appels · " + group.missing_cost_runs + " coûts inconnus"));
  }
  $("count").textContent = rows.length + " missions";
  return f;
}
function proof() {
  const f = section(
    "Preuves et revues",
    "Une vérification est liée à une empreinte du contenu et du contrat. Les identités des revues sont déclaratives.",
  );
  const legend = el("div", undefined, "legend");
  legend.append(
    badge("Déclaré par un agent"),
    badge("Vérification exécutée"),
    badge("Acceptation enregistrée"),
  );
  f.append(legend);
  f.append(
    cardList(
      [...records.evidence, ...records.reviews],
      (r) => r.task + " · " + r.id,
      (r) =>
        (r.verdict
          ? labels[r.verdict] + " · déclarée"
          : r.passed
            ? "Vérification réussie"
            : "Vérification échouée") +
        (r.fingerprint !== data.fingerprint ? " · contenu ancien" : ""),
    ),
  );
  return f;
}
const views = [
  ["overview", "Vue d’ensemble", overview],
  [
    "tasks",
    "Missions",
    () =>
      cardList(
        records.tasks,
        (r) => r.title,
        (r) => labels[r.status],
      ),
  ],
  [
    "decisions",
    "Décisions",
    () =>
      cardList(
        records.decisions,
        (r) => r.title,
        (r) =>
          r.status === "active" ? "Active" : labels[r.status] || r.status,
      ),
  ],
  [
    "risks",
    "Risques",
    () =>
      cardList(
        [...records.findings, ...records.exceptions],
        (r) => r.title || r.reason,
        (r) =>
          r.severity
            ? labels[r.status] + " · " + r.severity
            : "Exception déclarée",
      ),
  ],
  ["orchestrations", "Orchestration", () => cardList(
    records.orchestrations || [],
    r => r.task + " · " + r.profile.roles.orchestrator.model,
    r => r.status + " · " + r.steps.length + " appels · tour " + r.round
  )],
  ["method", "Cadrage", () => cardList(
    [...(records.artifacts || []), ...(records.artifact_reviews || [])],
    r => r.kind ? r.kind + " · " + r.path : "Revue de préparation · " + r.artifact,
    r => r.verdict ? labels[r.verdict] : "Document enregistré"
  )],
  ["interfaces", "Interfaces", () => cardList(records.interfaces || [],
    r => r.name + " · version " + r.version, r => r.id)],
  ["proof", "Preuves", proof],
  ["costs", "Coûts", economics],
  [
    "memory",
    "Journaux",
    () =>
      cardList(
        records.runs,
        (r) => r.task + " · " + r.model,
        (r) => r.outcome + " · " + r.cost_source,
      ),
  ],
];
let active = "overview";
function render() {
  const selected = views.find((v) => v[0] === active);
  $("view").replaceChildren(selected[2]());
  for (const button of $("navigation").children)
    button.setAttribute("aria-current", String(button.dataset.view === active));
}
for (const [id, label] of views) {
  const b = el("button", label);
  b.dataset.view = id;
  b.onclick = () => {
    active = id;
    render();
  };
  $("navigation").append(b);
}
$("project").textContent = data.policy.project;
$("subtitle").textContent =
  "Du besoin au livrable accepté, avec les décisions et les preuves.";
$("health").textContent = data.validation.ok
  ? "Fiches cohérentes"
  : "À examiner";
if (!data.validation.ok) $("health").classList.add("bad");
$("footer").textContent =
  "Générée le " +
  payload.generated_at +
  " · Commit observé " +
  payload.observed_head +
  " · Empreinte " +
  data.fingerprint +
  " · Régénérer : framework map";
$("search").addEventListener("input", render);
render();
;
    </script>
  </body>
</html>
