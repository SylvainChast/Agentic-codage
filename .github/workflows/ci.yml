name: Framework CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and bundled assets
        run: python -m pip install .
      - name: Invariant and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository records
        run: framework check
      - name: Validate generated adapters
        run: framework adapters --check
      - name: Validate documentation links
        run: python scripts/check_docs.py
      - name: Exercise isolated end-to-end example
        run: python examples/demo.py
      - name: Render and validate offline map
        run: |
          framework map
          framework map --check
