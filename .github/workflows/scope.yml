name: Task scope
on:
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: Task identifier already registered on base
        required: true
        type: string
      base:
        description: Trusted base commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check PR contract or bounded planning change
        if: github.event_name == 'pull_request'
        run: python scripts/ci_scope.py
      - name: Check explicit contract against supplied base
        if: github.event_name == 'workflow_dispatch'
        env:
          FRAMEWORK_TASK: ${{ inputs.task }}
          FRAMEWORK_BASE: ${{ inputs.base }}
        run: python bin/framework check --task "$FRAMEWORK_TASK" --base "$FRAMEWORK_BASE"
